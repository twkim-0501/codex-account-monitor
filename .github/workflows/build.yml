name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build widget
        run: dotnet build src/CodexAccountMonitor/CodexAccountMonitor.csproj -c Release
      - name: Verify quota parsing and transport
        run: dotnet run --project tests/CodexAccountMonitor.Tests -c Release
      - name: Publish portable executable
        run: dotnet publish src/CodexAccountMonitor/CodexAccountMonitor.csproj -c Release -r win-x64 --self-contained true -o dist
      - name: Render demo for UI smoke check
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\CodexAccountMonitor.exe -ArgumentList '--demo --screenshot "${{ github.workspace }}\dist\preview.png"' -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(30000)) { $process.Kill(); throw 'Widget screenshot timed out' }
          if ($process.ExitCode -ne 0 -or !(Test-Path .\dist\preview.png) -or !(Test-Path .\dist\mini-preview.png) -or !(Test-Path .\dist\add-ssh-preview.png)) { throw 'Widget screenshot failed' }
          $overflow = Start-Process -FilePath .\dist\CodexAccountMonitor.exe -ArgumentList '--demo --demo-accounts 8 --screenshot "${{ github.workspace }}\dist\overflow\preview.png"' -WindowStyle Hidden -PassThru
          if (!$overflow.WaitForExit(30000)) { $overflow.Kill(); throw 'Overflow preview timed out' }
          if ($overflow.ExitCode -ne 0 -or !(Test-Path .\dist\overflow\mini-preview.png)) { throw 'Overflow preview failed' }
      - name: Verify content-sized detail panel
        shell: pwsh
        run: |
          foreach ($count in @(3, 8)) {
            $process = Start-Process -FilePath .\dist\CodexAccountMonitor.exe -ArgumentList "--demo-accounts $count --layout-check `"${{ github.workspace }}\dist\layout-$count`"" -WindowStyle Hidden -PassThru
            if (!$process.WaitForExit(30000)) { $process.Kill(); throw 'Panel layout check timed out' }
            if ($process.ExitCode -ne 0) { Get-Content "dist\layout-$count\layout-check.json" -ErrorAction SilentlyContinue; throw 'Panel layout check failed' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: codex-account-monitor-win-x64
          path: |
            dist/CodexAccountMonitor.exe
            dist/preview.png
            dist/mini-preview.png
            dist/mini-preview-dark.png
            dist/add-ssh-preview.png
            dist/overflow/*.png
            dist/layout-*/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item README.md dist\README.md
          Copy-Item LICENSE dist\LICENSE
          Copy-Item CHANGELOG.md dist\CHANGELOG.md
          Copy-Item docs dist\docs -Recurse
          Get-FileHash dist\CodexAccountMonitor.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  CodexAccountMonitor.exe" } | Set-Content dist\SHA256SUMS.txt
          Compress-Archive -Path dist\CodexAccountMonitor.exe,dist\README.md,dist\CHANGELOG.md,dist\LICENSE,dist\SHA256SUMS.txt,dist\docs -DestinationPath dist\CodexAccountMonitor-win-x64.zip
          @'
          상세 창 높이가 실제 계정 내용에 맞춰 자동으로 늘어나고 줄어듭니다. 계정을 펼치거나 접을 때, 같은 계정 수로 새로고침할 때, 창 너비를 바꿀 때와 다시 열 때 높이를 맞춥니다.

          기존의 680 높이 제한을 제거하여 화면에 공간이 있으면 전체 내용을 보여줍니다. 화면에서 사용할 수 있는 높이를 넘을 때만 스크롤합니다. 3개·8개 예시 계정으로 창 높이와 스크롤을 자동 검증합니다. 연결 설정은 유지됩니다.

          Download CodexAccountMonitor.exe from Assets and run it on Windows 10/11 x64. The .NET runtime is included; Codex app/CLI and an existing login are required. Quit the running monitor before replacing its executable. The ZIP also includes documentation. No code-signing certificate is included.

          Original concept/workflow: https://github.com/pjhun0412/codex-pulse . Adapted and rewritten in C#/WPF using OpenAI Codex. Full credits are in README.
          '@ | Set-Content dist\release-notes.md -Encoding utf8
          gh release create "$env:GITHUB_REF_NAME" dist\CodexAccountMonitor.exe dist\CodexAccountMonitor-win-x64.zip dist\SHA256SUMS.txt --title "Codex Account Monitor $env:GITHUB_REF_NAME" --notes-file dist\release-notes.md
