name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build widget
        run: dotnet build src/CodexAccountMonitor/CodexAccountMonitor.csproj -c Release
      - name: Verify quota parsing and transport
        run: dotnet run --project tests/CodexAccountMonitor.Tests -c Release
      - name: Publish portable executable
        run: dotnet publish src/CodexAccountMonitor/CodexAccountMonitor.csproj -c Release -r win-x64 --self-contained true -o dist
      - name: Render demo for UI smoke check
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\CodexAccountMonitor.exe -ArgumentList '--demo --screenshot "${{ github.workspace }}\dist\preview.png"' -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(30000)) { $process.Kill(); throw 'Widget screenshot timed out' }
          if ($process.ExitCode -ne 0 -or !(Test-Path .\dist\preview.png) -or !(Test-Path .\dist\mini-preview.png)) { throw 'Widget screenshot failed' }
          $overflow = Start-Process -FilePath .\dist\CodexAccountMonitor.exe -ArgumentList '--demo --demo-accounts 8 --screenshot "${{ github.workspace }}\dist\overflow\preview.png"' -WindowStyle Hidden -PassThru
          if (!$overflow.WaitForExit(30000)) { $overflow.Kill(); throw 'Overflow preview timed out' }
          if ($overflow.ExitCode -ne 0 -or !(Test-Path .\dist\overflow\mini-preview.png)) { throw 'Overflow preview failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: codex-account-monitor-win-x64
          path: |
            dist/CodexAccountMonitor.exe
            dist/preview.png
            dist/mini-preview.png
            dist/mini-preview-dark.png
            dist/overflow/*.png
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item README.md dist\README.md
          Copy-Item LICENSE dist\LICENSE
          Copy-Item docs dist\docs -Recurse
          Get-FileHash dist\CodexAccountMonitor.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  CodexAccountMonitor.exe" } | Set-Content dist\SHA256SUMS.txt
          Compress-Archive -Path dist\CodexAccountMonitor.exe,dist\README.md,dist\LICENSE,dist\SHA256SUMS.txt,dist\docs -DestinationPath dist\CodexAccountMonitor-win-x64.zip
          gh release create "$env:GITHUB_REF_NAME" dist\CodexAccountMonitor.exe dist\CodexAccountMonitor-win-x64.zip dist\SHA256SUMS.txt --title "Codex Account Monitor $env:GITHUB_REF_NAME" --notes "Minimal redesign: translucent single-row taskbar chips for up to three accounts, a bounded +N overflow button, light expandable account rows, and optional short account names. Preserves existing connections. Codex Pulse concept/workflow reference: https://github.com/pjhun0412/codex-pulse . Adapted and rewritten using OpenAI Codex, with a newly designed v1.2 interface. Includes .NET runtime; Codex app/CLI required. No code signing certificate is included."
